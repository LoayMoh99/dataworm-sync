name: Sync DAGs to Airflow (dev)

on:
  push:
    branches: [main]
    paths:
      - "airflow/dags/**"
  workflow_dispatch: {}

concurrency:
  group: sync-dags-dev
  cancel-in-progress: true

# Keep these in lockstep with docker/airflow/Dockerfile so validation runs
# against the same Airflow/providers the server actually has.
env:
  AIRFLOW_VERSION: "3.3.0"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Airflow + providers (mirrors docker/airflow/Dockerfile)
        run: |
          pip install \
            "apache-airflow==${AIRFLOW_VERSION}" \
            "apache-airflow-providers-postgres" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "airflow-clickhouse-plugin" "clickhouse-connect"

      - name: Check DAGs import cleanly
        run: |
          export AIRFLOW_HOME=$(mktemp -d)
          python - <<'EOF'
          import sys
          from airflow.models.dagbag import DagBag

          dagbag = DagBag(dag_folder="airflow/dags", include_examples=False)
          if dagbag.import_errors:
              for path, err in dagbag.import_errors.items():
                  print(f"IMPORT ERROR in {path}:\n{err}\n", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(dagbag.dags)} DAG(s) parsed: {list(dagbag.dags)}")
          EOF

  deploy:
    name: Deploy to dev Airflow
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync airflow/dags/ to the server's dags folder
        run: |
          rsync -avz --delete \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=yes" \
            airflow/dags/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.AIRFLOW_DAGS_PATH }}/"
