name: Sync DAGs to Airflow (dev)

on:
  push:
    branches: [main]
    paths:
      - "airflow/dags/**"
  workflow_dispatch: {}

concurrency:
  group: sync-dags-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to dev Airflow
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync airflow/dags/ to the server's dags folder
        run: |
          rsync -avz --delete \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=yes" \
            airflow/dags/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.AIRFLOW_DAGS_PATH }}/"
