name: Sync repo to dev server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: sync-dags-dev
  cancel-in-progress: true

env:
  # Path of the repo clone on the dev server (not secret, just configuration).
  DEPLOY_PATH: /home/ubuntu/dataworm

jobs:
  deploy:
    name: Pull latest main on dev server
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: git pull on the server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -p ${{ secrets.SSH_PORT || 22 }} \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -e
               cd '${DEPLOY_PATH}'
               git fetch origin main
               git checkout main
               git reset --hard origin/main
               echo 'Now at:' && git log --oneline -1"
